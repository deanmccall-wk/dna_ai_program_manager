version: 2

sources:
  - name: data_platform
    database: gold_dev
    schema: data_platform
    tables:
      - name: raw_redshift_scans
        description: "Raw stl_scan aggregation from Redshift. Appended daily, may contain duplicates."
      - name: raw_redshift_objects
        description: "Raw Redshift object inventory (tables, MVs, views). Full replace each extract."
      - name: raw_atlan_lineage
        description: "Raw Atlan lineage edges. Flattened from lineage API, enriched with attributes."

  - name: marts
    database: gold_prod
    schema: marts
    tables:
      - name: dim_workers
        description: "Worker dimension table for DNA team identification."
